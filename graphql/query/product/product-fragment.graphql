fragment product on object_CoreShopProduct {
  id
  name
  images {
    ... on asset {
      fullpath
    }
  }
  imagesCartPreview: images {
    ... on asset {
      fullpath(thumbnail: "coreshop_productCartPreview")
    }
  }
  imagesCartProduct: images {
    ... on asset {
      fullpath(thumbnail: "coreshop_productCart")
    }
  }
  isTracked
  stockAvailability
  shortDescription
}
