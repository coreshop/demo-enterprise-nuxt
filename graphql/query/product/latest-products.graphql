
#import "product-fragment.graphql"
#import "../error.graphql"

query getCoreShopLatestProducts {
  CoreShopLatestProducts {
    ... on CoreShopLatestProductsResult {
      products {
        edges {
          node {
            ...product
          }
        }
      }
    }
    ... on CoreShopError {
      ...error
    }
  }
}